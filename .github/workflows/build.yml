name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q lagdrop.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd lagdrop && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lagdrop-debug-apk
          path: lagdrop/app/build/outputs/apk/debug/app-debug.apk
